name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        working-directory: SpeedIsland
        run: |
          xcodebuild -project SpeedIsland.xcodeproj \
            -target SpeedIsland \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify widget is embedded
        working-directory: SpeedIsland
        run: |
          ls -la build/Release-iphoneos/SpeedIsland.app/PlugIns/

      - name: Package IPA
        working-directory: SpeedIsland
        run: |
          APP_PATH="build/Release-iphoneos/SpeedIsland.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SpeedIsland-unsigned.ipa Payload
          ls -lh SpeedIsland-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpeedIsland-unsigned-ipa
          path: SpeedIsland/SpeedIsland-unsigned.ipa
          retention-days: 30
